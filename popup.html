<!DOCTYPE html>
<!--
  popup.html
  Main UI for the AI Text Summarizer extension.
  Displayed when the user clicks the extension icon or after selecting text
  and clicking "Summarize with AI" from the context menu.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Text Summarizer</title>
    <style>
      /* -----------------------------------------------------------------------
         Reset & base
      ----------------------------------------------------------------------- */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        width: 380px;
        min-height: 160px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #1a1a2e;
        background: #ffffff;
      }

      /* -----------------------------------------------------------------------
         Header
      ----------------------------------------------------------------------- */
      header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 16px 12px;
        background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        color: #ffffff;
      }

      header .logo {
        width: 28px;
        height: 28px;
        background: rgba(255, 255, 255, 0.25);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        flex-shrink: 0;
      }

      header h1 {
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }

      /* -----------------------------------------------------------------------
         Main content area
      ----------------------------------------------------------------------- */
      main {
        padding: 16px;
      }

      /* -----------------------------------------------------------------------
         State: idle (no summary yet)
      ----------------------------------------------------------------------- */
      #state-idle {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 24px 0 8px;
        color: #6b7280;
        text-align: center;
      }

      #state-idle .idle-icon {
        font-size: 32px;
      }

      #state-idle p {
        font-size: 13px;
        line-height: 1.5;
        max-width: 260px;
      }

      /* -----------------------------------------------------------------------
         State: loading (spinner)
      ----------------------------------------------------------------------- */
      #state-loading {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 28px 0 12px;
        color: #6b7280;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e0e7ff;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #state-loading p {
        font-size: 13px;
      }

      /* -----------------------------------------------------------------------
         State: success (summary text)
      ----------------------------------------------------------------------- */
      #state-success {
        display: none;
      }

      .summary-label {
        font-size: 11px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #7c3aed;
        margin-bottom: 8px;
      }

      #summary-text {
        background: #f5f3ff;
        border: 1px solid #ddd6fe;
        border-radius: 8px;
        padding: 12px 14px;
        font-size: 13px;
        line-height: 1.65;
        color: #1a1a2e;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 300px;
        overflow-y: auto;
      }

      /* Scrollbar styling for the summary box */
      #summary-text::-webkit-scrollbar {
        width: 6px;
      }
      #summary-text::-webkit-scrollbar-track {
        background: #ede9fe;
        border-radius: 3px;
      }
      #summary-text::-webkit-scrollbar-thumb {
        background: #c4b5fd;
        border-radius: 3px;
      }

      /* -----------------------------------------------------------------------
         State: setup required (no API key configured)
      ----------------------------------------------------------------------- */
      #state-setup {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 20px 0 8px;
        color: #6b7280;
        text-align: center;
      }

      #state-setup .setup-icon {
        font-size: 30px;
      }

      #state-setup p {
        font-size: 13px;
        line-height: 1.5;
        max-width: 270px;
      }

      #btn-open-options {
        margin-top: 4px;
        background: #4f46e5;
        color: #ffffff;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        padding: 7px 16px;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      #btn-open-options:hover {
        opacity: 0.85;
      }

      /* -----------------------------------------------------------------------
         State: error
      ----------------------------------------------------------------------- */
      #state-error {
        display: none;
      }

      .error-box {
        display: flex;
        gap: 10px;
        background: #fff1f2;
        border: 1px solid #fecdd3;
        border-radius: 8px;
        padding: 12px 14px;
        color: #be123c;
        font-size: 13px;
        line-height: 1.5;
      }

      .error-box .error-icon {
        font-size: 18px;
        flex-shrink: 0;
        line-height: 1.3;
      }

      /* -----------------------------------------------------------------------
         Footer action buttons
      ----------------------------------------------------------------------- */
      footer {
        display: none; /* shown only when there's a result */
        justify-content: flex-end;
        padding: 10px 16px 14px;
        border-top: 1px solid #f3f4f6;
        gap: 8px;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 13px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        padding: 7px 14px;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.85;
      }

      #btn-copy {
        background: #4f46e5;
        color: #ffffff;
      }

      #btn-clear {
        background: #f3f4f6;
        color: #374151;
      }

      /* Toast notification for copy confirmation */
      #toast {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%) translateY(40px);
        background: #1a1a2e;
        color: #ffffff;
        font-size: 12px;
        padding: 6px 14px;
        border-radius: 20px;
        opacity: 0;
        transition: opacity 0.2s ease, transform 0.2s ease;
        pointer-events: none;
        white-space: nowrap;
      }

      #toast.visible {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>

  <body>
    <!-- Header -->
    <header>
      <div class="logo" aria-hidden="true">✦</div>
      <h1>AI Text Summarizer</h1>
    </header>

    <!-- Main content: one of the four state panels is visible at a time -->
    <main>
      <!-- Setup state: shown when no API key has been configured -->
      <div id="state-setup">
        <div class="setup-icon" aria-hidden="true">🔑</div>
        <p>
          Add your OpenAI API key in the extension options to get started.
        </p>
        <button id="btn-open-options">Open Options</button>
      </div>

      <!-- Idle state: shown before any summarization has been triggered -->
      <div id="state-idle">
        <div class="idle-icon" aria-hidden="true">📋</div>
        <p>
          Select text on any page, right-click, and choose
          <strong>"Summarize with AI"</strong> to get started.
        </p>
      </div>

      <!-- Loading state: shown while the API request is in flight -->
      <div id="state-loading" role="status" aria-live="polite">
        <div class="spinner" aria-hidden="true"></div>
        <p>Summarizing&hellip;</p>
      </div>

      <!-- Success state: shows the summary returned by OpenAI -->
      <div id="state-success">
        <p class="summary-label">Summary</p>
        <div id="summary-text" role="region" aria-label="Summary result"></div>
      </div>

      <!-- Error state: shows a user-friendly error message -->
      <div id="state-error" role="alert">
        <div class="error-box">
          <span class="error-icon" aria-hidden="true">⚠️</span>
          <span id="error-message"></span>
        </div>
      </div>
    </main>

    <!-- Footer buttons (copy / clear) — only visible when a result exists -->
    <footer id="footer">
      <button id="btn-clear" title="Clear result">Clear</button>
      <button id="btn-copy" title="Copy summary to clipboard">Copy</button>
    </footer>

    <!-- Toast notification -->
    <div id="toast" aria-live="assertive">Copied!</div>

    <script src="popup.js"></script>
  </body>
</html>

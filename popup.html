<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Text Summarizer</title>
  <style>
    body {
      width: 400px;
      min-height: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 15px 0;
      color: #333;
    }
    textarea {
      width: 100%;
      min-height: 100px;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 14px;
      font-family: Arial, sans-serif;
      resize: vertical;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    button:disabled {
      background-color: #ccc;
      cursor: not-allowed;
    }
    #result {
      margin-top: 15px;
      padding: 10px;
      background-color: #f9f9f9;
      border-radius: 4px;
      border: 1px solid #ddd;
      display: none;
    }
    .error {
      background-color: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
    }
    .loading {
      text-align: center;
      color: #666;
    }
    .settings-link {
      display: block;
      text-align: center;
      margin-top: 10px;
      color: #2196F3;
      text-decoration: none;
      font-size: 13px;
    }
    .settings-link:hover {
      text-decoration: underline;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>AI Text Summarizer</h1>
  
  <div>
    <label for="text-input">Enter text to summarize:</label>
    <textarea id="text-input" placeholder="Paste your text here..."></textarea>
  </div>
  
  <button id="summarize-btn">Summarize</button>
  
  <div id="result"></div>
  
  <a href="#" id="settings-link" class="settings-link">Configure API Key</a>
  
  <script src="popup.js"></script>
</body>
</html>

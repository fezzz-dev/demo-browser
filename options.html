<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Text Summarizer Options</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    h1 {
      color: #333;
      font-size: 24px;
      margin-bottom: 20px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #555;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border: 1px solid #ddd;
      border-radius: 4px;
      box-sizing: border-box;
    }
    button {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    button:hover {
      background-color: #45a049;
    }
    .status {
      margin-top: 10px;
      padding: 10px;
      border-radius: 4px;
      display: none;
    }
    .status.success {
      background-color: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .status.error {
      background-color: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background-color: #e7f3ff;
      padding: 15px;
      border-radius: 4px;
      margin-bottom: 20px;
      border-left: 4px solid #2196F3;
    }
    .info p {
      margin: 5px 0;
      color: #555;
    }
    .info a {
      color: #2196F3;
      text-decoration: none;
    }
    .info a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>AI Text Summarizer Settings</h1>
  
  <div class="info">
    <p><strong>Setup Instructions:</strong></p>
    <p>1. Get your OpenAI API key from: <a href="https://platform.openai.com/account/api-keys" target="_blank">https://platform.openai.com/account/api-keys</a></p>
    <p>2. Enter your API key below and click Save</p>
    <p>3. Your API key will be securely stored in your browser</p>
  </div>

  <form id="options-form">
    <div class="form-group">
      <label for="api-key">OpenAI API Key:</label>
      <input type="text" id="api-key" placeholder="sk-..." required>
    </div>
    
    <button type="submit">Save API Key</button>
    
    <div id="status" class="status"></div>
  </form>

  <script src="options.js"></script>
</body>
</html>

<!DOCTYPE html>
<!--
  options.html
  Options page for the AI Text Summarizer extension.
  Allows users to enter and save their OpenAI API key.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Text Summarizer – Options</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
        font-size: 14px;
        color: #1a1a2e;
        background: #f9fafb;
        padding: 32px;
        max-width: 480px;
      }

      h1 {
        font-size: 18px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .subtitle {
        font-size: 13px;
        color: #6b7280;
        margin-bottom: 24px;
      }

      label {
        display: block;
        font-weight: 500;
        margin-bottom: 6px;
      }

      input[type="password"],
      input[type="text"] {
        width: 100%;
        padding: 8px 12px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        font-size: 14px;
        font-family: inherit;
        color: #1a1a2e;
        outline: none;
        transition: border-color 0.15s ease;
      }

      input[type="password"]:focus,
      input[type="text"]:focus {
        border-color: #4f46e5;
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .hint {
        font-size: 12px;
        color: #6b7280;
        margin-top: 6px;
      }

      .hint a {
        color: #4f46e5;
        text-decoration: none;
      }

      .hint a:hover {
        text-decoration: underline;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-top: 20px;
      }

      button {
        cursor: pointer;
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        border: none;
        border-radius: 6px;
        padding: 8px 18px;
        transition: opacity 0.15s ease;
      }

      button:hover {
        opacity: 0.85;
      }

      #btn-save {
        background: #4f46e5;
        color: #ffffff;
      }

      #status {
        font-size: 13px;
        color: #059669;
        font-weight: 500;
      }

      #status.error {
        color: #be123c;
      }
    </style>
  </head>

  <body>
    <h1>AI Text Summarizer</h1>
    <p class="subtitle">Configure your OpenAI API key to enable summarization.</p>

    <label for="api-key-input">OpenAI API Key</label>
    <input
      type="password"
      id="api-key-input"
      placeholder="sk-..."
      autocomplete="off"
      spellcheck="false"
    />
    <p class="hint">
      Your key is stored locally in your browser and never sent anywhere except
      directly to <a href="https://api.openai.com" target="_blank" rel="noopener">api.openai.com</a>.
      Get your key at
      <a href="https://platform.openai.com/account/api-keys" target="_blank" rel="noopener">
        platform.openai.com/account/api-keys
      </a>.
    </p>

    <div class="actions">
      <button id="btn-save">Save</button>
      <span id="status" aria-live="polite"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
